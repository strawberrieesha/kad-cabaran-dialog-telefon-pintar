<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Misi Kad Dialog - Canggihnya Telefon Pintar</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff2b8,#e0f3ff 50%,#ffe0ef);min-height:100vh;color:#26345d;text-align:center}.wrap{max-width:1100px;margin:auto;padding:24px 16px}h1{font-size:clamp(28px,5vw,54px);margin:12px 0;color:#e32880;text-shadow:2px 2px #fff}h2{margin:0 0 12px}.intro{font-size:19px}.toolbar{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:20px}button{font:inherit;cursor:pointer;border:0} .tool{background:white;border:2px solid #bdc9ed;padding:11px 18px;border-radius:18px;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:22px}.card{position:relative;min-height:220px;border-radius:28px;border:5px solid white;box-shadow:0 10px 0 #0002,0 12px 22px #0002;color:white;font-size:clamp(25px,4vw,42px);font-weight:900;transition:transform .15s}.card:hover{transform:translateY(-7px) rotate(-1deg)}.card:focus-visible,.tool:focus-visible{outline:4px solid #152a7e;outline-offset:3px}.card small{display:block;font-size:17px;margin-top:10px}.c0{background:linear-gradient(140deg,#ff6c96,#e5277a)}.c1{background:linear-gradient(140deg,#50b5ff,#2366db)}.c2{background:linear-gradient(140deg,#a47bff,#6536c8)}.c3{background:linear-gradient(140deg,#46cf98,#128c78)}.empty{padding:45px 10px;font-size:25px;font-weight:bold}.overlay{position:fixed;inset:0;background:#182348b8;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.overlay.show{display:flex}.modal{width:min(620px,100%);background:white;border:7px solid #ffe36b;border-radius:30px;padding:28px;box-shadow:0 18px 60px #0005}.tag{display:inline-block;background:#ffdf65;border-radius:30px;padding:9px 18px;font-weight:bold}.title{font-size:clamp(25px,4vw,37px);color:#d81d75;margin:17px 0}.desc{font-size:20px;line-height:1.5}.challenge{background:#e7f5ff;border-radius:18px;padding:14px;font-weight:bold;font-size:20px;margin:20px 0}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.primary,.secondary{border-radius:16px;padding:14px 20px;font-weight:bold;font-size:18px}.primary{background:#25a66d;color:white}.secondary{background:#e9ecf6;color:#26345d}.foot{margin-top:24px;color:#4d5571;font-size:15px}@media(max-width:600px){.grid{gap:12px}.card{min-height:175px}.modal{padding:18px}.desc{font-size:17px}}</style></head><body><main class="wrap"><div style="font-size:42px">📱 ✨ 🎤</div><h1>MISI KAD DIALOG</h1><h2>Canggihnya Telefon Pintar!</h2><p class="intro">Wakil kumpulan, pilih satu kad misteri untuk mengetahui tajuk dialog anda!</p><div class="toolbar"><button class="tool" id="sound">🔊 Bunyi: ON</button><button class="tool" id="reset">🔄 Main Semula</button></div><p id="count" aria-live="polite"></p><div id="grid" class="grid"></div><p class="foot">Kad yang disahkan akan hilang supaya tidak dipilih oleh kumpulan lain.</p></main><div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="title"><section class="modal"><span class="tag" id="number"></span><h2 class="title" id="title"></h2><p class="desc" id="desc"></p><div class="challenge">💬 Cabaran: Bina dialog ada watak A dan watak B dalam kumpulan anda!</div><div class="actions"><button class="primary" id="confirm">✅ Sahkan Pilihan</button><button class="secondary" id="cancel">↩ Kembali</button></div></section></div><script>
'use strict';const data=[{t:'Telefon Pintar Penghubung Kasih',d:'Dua sahabat berbual tentang cara telefon pintar membantu mereka berhubung dengan keluarga yang tinggal berjauhan.'},{t:'Belajar Lebih Mudah dengan Telefon Pintar',d:'Dua rakan berbincang tentang kegunaan telefon pintar untuk mencari maklumat dan menyiapkan tugasan sekolah.'},{t:'Bijak Menggunakan Telefon Pintar',d:'Dua rakan berbincang tentang kesan penggunaan telefon pintar secara berlebihan dan cara mengurus masa skrin.'},{t:'Keselamatan di Hujung Jari',d:'Dua sahabat berbincang tentang cara melindungi maklumat peribadi dan mengelakkan penipuan dalam talian.'}];let remaining=new Set([0,1,2,3]),selected=null,soundOn=true,audio;const $=id=>document.getElementById(id);function tone(freq,duration,delay=0){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let osc=audio.createOscillator(),gain=audio.createGain(),now=audio.currentTime+delay;osc.type='sine';osc.frequency.setValueAtTime(freq,now);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.16,now+.015);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(gain);gain.connect(audio.destination);osc.start(now);osc.stop(now+duration+.02)}catch(e){}}function sound(kind){if(kind==='open'){tone(520,.18);tone(780,.25,.14)}else{tone(650,.16);tone(870,.16,.14);tone(1100,.3,.28)}}function render(){const g=$('grid');g.innerHTML='';$('count').textContent='Kad tersedia: '+remaining.size+' daripada 4';if(!remaining.size){g.innerHTML='<div class="empty" style="grid-column:1/-1">🎉 Tahniah! Semua kad telah dipilih. Selamat membina dialog!</div>';return}for(let i=0;i<4;i++){if(!remaining.has(i))continue;let b=document.createElement('button');b.className='card c'+i;b.innerHTML='🎁<br>KAD '+(i+1)+'<small>TEKAN UNTUK BUKA ✨</small>';b.onclick=()=>openCard(i);g.appendChild(b)}}function openCard(i){selected=i;$('number').textContent='KAD MISTERI '+(i+1);$('title').textContent=data[i].t;$('desc').textContent=data[i].d;$('overlay').classList.add('show');sound('open')}function closeCard(){$('overlay').classList.remove('show');selected=null}$('cancel').onclick=closeCard;$('confirm').onclick=()=>{if(selected!==null){remaining.delete(selected);sound('confirm');closeCard();render()}};$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 Bunyi: ON':'🔇 Bunyi: OFF';if(soundOn)sound('open')};$('reset').onclick=()=>{if(remaining.size===4||confirm('Mulakan semula? Semua kad akan muncul kembali.')){remaining=new Set([0,1,2,3]);closeCard();render()}};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCard()});render();</script></body></html>
